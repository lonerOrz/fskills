# Skill Sources Specification
#
# A source can be either REMOTE (fetched from GitHub) or LOCAL (authored in this repo).
# Each [[sources]] table must define either 'repo' or 'path', but not both.
#
# ------------------------------------------------------------------------------
# Remote Source Fields:
#   repo:
#     GitHub repository in "owner/repository" format. (Required for remote)
#   branch:
#     Git branch to track. If omitted, uses the remote's default branch.
#   target:
#     Local destination directory. If omitted, defaults to "skills/".
#   skills:
#     Package selectors relative to the remote repo root. Defaults to ["*"].
#
# Local Source Fields:
#   path:
#     Local directory path relative to project root. (Required for local)
#     Does not perform remote fetch, clone, or write to source.lock.toml.
#   target:
#     Destination directory for identification. Defaults to the same as 'path'.
#   skills:
#     Package selectors relative to 'path'. Defaults to ["*"].
#
# ------------------------------------------------------------------------------
# Supported Selectors:
#   "*"                -> recursively discover all directories containing SKILL.md
#   "path/*"           -> search direct child directories under path
#   "path/to/skill"    -> exact match for a directory containing SKILL.md
#   "path/^regex.*$"   -> regex-match direct child directories
#
# Rule: A directory is considered a skill package if it contains SKILL.md.
# When SKILL.md is inside a "skill/" directory, its parent is the package root.
# ------------------------------------------------------------------------------


# Sync selected skill packages from Mic92.
[[sources]]
repo = "Mic92/mics-skills"
target = "skills/mic92"
skills = [
    "browser-cli",
    "context7-cli",
    "kagi-search",
]


# Sync selected skill packages from Matt Pocock.
[[sources]]
repo = "mattpocock/skills"
target = "skills/matt"
skills = [
    "skills/engineering/*",
    "skills/productivity/*",
    "skills/in-progress/pr",
]


# Sync selected skill packages from Matt Pocock.
[[sources]]
repo = "longbridge/gpui-kit"
target = "skills/gpui"
skills = [
    "skills/*",
]


#  https://github.com/Leonxlnx/taste-skill.git
[[sources]]
repo = "Leonxlnx/taste-skill"
target = "skills/taste"
skills = [
    "skills/taste-skill",
]


# Local self-authored skills (tracked directly in this repository).
# Never fetched, never locked; validated on 'check' and linked on 'link'.
[[sources]]
path = "skills/loner"
skills = ["*"]
