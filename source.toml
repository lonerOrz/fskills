# Remote: repo + optional branch/target/skills. Local: path + optional target/skills.
# Selectors: "*" (recursive), "path/*" (direct children), "path/to/skill" (exact), "path/^regex" (regex children).
# A directory is a skill package if it contains SKILL.md; inside "skill/", the parent is the root.
# Optional: package_name (overrides repo-leaf default for root-wrapped single-skill repos).


[[sources]]
repo = "Mic92/mics-skills"
target = "skills/mic92"
skills = [
    "browser-cli",
    "context7-cli",
    "kagi-search",
]


[[sources]]
repo = "mattpocock/skills"
target = "skills/matt"
skills = [
    "skills/engineering/*",
    "skills/productivity/*",
    "skills/in-progress/*",
]


[[sources]]
repo = "longbridge/gpui-kit"
