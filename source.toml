# Skills live in per-domain subdirs; only the → Rust migration skill is pulled.
[[sources]]
repo = "google/skills"
target = "skills/google"
skills = [
    "skills/developers/migrate-to-rust",
]

# Single-skill repo (SKILL.md at root) → one package named after the repo.
[[sources]]
repo = "RealAdarsh/cpp-to-rust-skill"
target = "skills/cpp-to-rust-skill"
skills = ["*"]

# Local self-authored; never fetched, never locked.
[[sources]]
path = "skills/loner"
skills = ["*"]
