name: sync upstream skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: true

jobs:
  sync:
    name: check and update skills
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      BRANCH_NAME: sync-upstream-skills
      LABEL_NAME: automated-sync

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.GH_TOKEN }}
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 运行 check --json，提取结构化数据
      - name: inspect upstream state
        id: check_step
        run: |
          python3 .github/scripts/source.py check --json > /tmp/check_report.json

          NEEDS_SYNC=$(jq -r '.summary.needs_sync' /tmp/check_report.json)
          echo "needs_sync=$NEEDS_SYNC" >> $GITHUB_OUTPUT

          # 渲染 Markdown 报告
          python3 - <<'EOF'
          import json

          with open("/tmp/check_report.json") as f:
              data = json.load(f)

          summary = data.get("summary", {})
          sources = data.get("sources", [])
          stale_locks = data.get("stale_locks", [])

          lines = [
              "## upstream skills sync",
              "",
              "> [!NOTE]",
              "> Automated repository synchronization state generated by `source.py`.",
              "",
              f"**Summary**: `{summary.get('sources', 0)}` sources inspected &middot; "
              f"`{summary.get('updates', 0)}` commit updates &middot; "
              f"`{summary.get('local_desync', 0)}` desynchronized",
              "",
              "| Source | Branch | Status | Locked | Remote | Package Delta |",
              "| :--- | :--- | :--- | :--- | :--- | :--- |",
          ]

          status_badge = {
              "UP-TO-DATE": "**up-to-date**",
              "UPDATE": "**update**",
              "DESYNC": "**desync**",
              "UNLOCKED": "**unlocked**",
          }

          for s in sources:
              repo = f"`{s['repo']}`"
              branch = f"`{s['branch']}`"
              status = status_badge.get(s['status'], s['status'])
              locked = f"`{s['locked_commit'][:8]}`" if s.get('locked_commit') else "none"
              remote = f"`{s['remote_commit'][:8]}`"

              changes = []
              if s.get("missing_packages"):
                  changes.append(f"`+` add: {', '.join(f'`{p}`' for p in s['missing_packages'])}")
              if s.get("extra_packages"):
                  changes.append(f"`-` prune: {', '.join(f'`{p}`' for p in s['extra_packages'])}")
              if s.get("locked_commit") != s.get("remote_commit"):
                  changes.append("`~` commit bump")

              change_str = "<br>".join(changes) if changes else "&mdash;"
              lines.append(f"| {repo} | {branch} | {status} | {locked} | {remote} | {change_str} |")

          if stale_locks:
              lines.extend([
                  "",
                  "### Stale Lock Entries",
                  *(f"- `{r}`" for r in stale_locks)
              ])

          lines.extend([
              "",
              "<details>",
              "<summary>Metadata Inspection (JSON)</summary>",
              "",
              "```json",
              json.dumps(data, indent=2),
              "```",
              "</details>",
              "",
              "&mdash;",
              "<sub>Automated by `source.py check --json` & `source.py update`</sub>"
          ])

          with open("/tmp/pr_body.md", "w") as f:
              f.write("\n".join(lines))
          EOF

      # 将报告发布到 GitHub Actions Step Summary
      - name: publish report to step summary
        run: |
          cat /tmp/pr_body.md >> $GITHUB_STEP_SUMMARY

      # 如果状态一致，直接退出
      - name: exit if up to date
        if: steps.check_step.outputs.needs_sync == 'false'
        run: |
          echo "::notice title=up-to-date::all sources and packages are synchronized."

      # 仅在有变动时执行 update
      - name: materialize package updates
        if: steps.check_step.outputs.needs_sync == 'true'
        run: |
          python3 .github/scripts/source.py update

      # 校验工作区 diff
      - name: inspect filesystem diff
        if: steps.check_step.outputs.needs_sync == 'true'
        id: check_diff
        run: |
          if [ -z "$(git status --porcelain source.lock.toml skills/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 处理 Force Push 与 PR 复用
      - name: push changes and manage pull request
        if: steps.check_step.outputs.needs_sync == 'true' && steps.check_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PR_TITLE="chore(skills): sync upstream sources"

          EXISTING_PR=$(gh pr list \
            --state open \
            --head "$BRANCH_NAME" \
            --json number \
            --jq '.[0].number')

          git checkout -B "$BRANCH_NAME"
          git add source.lock.toml skills/
          git commit -m "$PR_TITLE"
          git push --force origin "$BRANCH_NAME"

          if [ -n "$EXISTING_PR" ]; then
            echo "updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body-file /tmp/pr_body.md
          else
            echo "creating new PR"
            gh pr create \
              --title "$PR_TITLE" \
              --body-file /tmp/pr_body.md \
              --base main \
              --head "$BRANCH_NAME" \
              --label "$LABEL_NAME"
          fi
