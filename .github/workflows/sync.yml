name: sync upstream skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: true

jobs:
  sync:
    name: check and update skills
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      BRANCH_NAME: sync-upstream-skills
      LABEL_NAME: automated-sync

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: inspect upstream state
        id: check_step
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/source.py check --json > /tmp/check_report.json

          needs_sync="$(jq -r '.summary.needs_sync' /tmp/check_report.json)"
          echo "needs_sync=$needs_sync" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import json

          with open("/tmp/check_report.json", encoding="utf-8") as f:
              data = json.load(f)

          summary = data.get("summary", {})
          sources = data.get("sources", [])
          stale_locks = data.get("stale_locks", [])

          lines = [
              "## upstream skills sync",
              "",
              "> [!NOTE]",
              "> Automated repository synchronization state generated by `source.py`.",
              "",
              (
                  f"**Summary**: `{summary.get('sources', 0)}` sources inspected "
                  f"&middot; `{summary.get('updates', 0)}` commit updates "
                  f"&middot; `{summary.get('local_desync', 0)}` desynchronized"
              ),
              "",
              "| Source | Branch | Status | Locked | Remote | Package Delta |",
              "| :--- | :--- | :--- | :--- | :--- | :--- |",
          ]

          status_badge = {
              "UP-TO-DATE": "**up-to-date**",
              "UPDATE": "**update**",
              "DESYNC": "**desync**",
              "UNLOCKED": "**unlocked**",
              "LOCAL": "**local**",
          }

          for source in sources:
              repo = (
                  f"`{source['repo']}`"
                  if source.get("repo")
                  else f"`{source.get('path')}`"
              )

              branch = (
                  f"`{source['branch']}`"
                  if source.get("branch")
                  else "&mdash;"
              )

              status = status_badge.get(
                  source.get("status", ""),
                  source.get("status", ""),
              )

              locked = (
                  f"`{source['locked_commit'][:8]}`"
                  if source.get("locked_commit")
                  else "&mdash;"
              )

              remote = (
                  f"`{source['remote_commit'][:8]}`"
                  if source.get("remote_commit")
                  else "&mdash;"
              )

              changes = []

              if source.get("missing_packages"):
                  packages = ", ".join(
                      f"`{package}`"
                      for package in source["missing_packages"]
                  )
                  changes.append(f"`+` add: {packages}")

              if source.get("extra_packages"):
                  packages = ", ".join(
                      f"`{package}`"
                      for package in source["extra_packages"]
                  )
                  changes.append(f"`-` prune: {packages}")

              if (
                  source.get("locked_commit")
                  and source.get("remote_commit")
                  and source["locked_commit"] != source["remote_commit"]
              ):
                  changes.append("`~` commit bump")

              change_str = "<br>".join(changes) if changes else "&mdash;"

              lines.append(
                  f"| {repo} | {branch} | {status} | "
                  f"{locked} | {remote} | {change_str} |"
              )

          if stale_locks:
              lines.extend([
                  "",
                  "### Stale Lock Entries",
                  *(f"- `{entry}`" for entry in stale_locks),
              ])

          lines.extend([
              "",
              "<details>",
              "<summary>Metadata Inspection (JSON)</summary>",
              "",
              "```json",
              json.dumps(data, indent=2),
              "```",
              "</details>",
              "",
              "&mdash;",
              (
                  "<sub>"
                  "Automated by `source.py check --json` & `source.py update`"
                  "</sub>"
              ),
          ])

          with open("/tmp/pr_body.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY

      - name: publish report to step summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/pr_body.md >> "$GITHUB_STEP_SUMMARY"

      - name: report up to date
        if: steps.check_step.outputs.needs_sync == 'false'
        shell: bash
        run: |
          echo "::notice title=up-to-date::all sources and packages are synchronized."

      - name: materialize package updates
        if: steps.check_step.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/source.py update

      - name: inspect filesystem diff
        if: steps.check_step.outputs.needs_sync == 'true'
        id: check_diff
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- source.lock.toml skills/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: push changes and manage pull request
        if: >
          steps.check_step.outputs.needs_sync == 'true' &&
          steps.check_diff.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pr_title="chore(skills): sync upstream sources"

          existing_pr="$(
            gh pr list \
              --state open \
              --head "$BRANCH_NAME" \
              --json number \
              --jq '.[0].number // empty'
          )"

          git checkout -B "$BRANCH_NAME"

          git add source.lock.toml skills/
          git commit -m "$pr_title"

          git push --force origin "$BRANCH_NAME"

          if [ -n "$existing_pr" ]; then
            echo "updating existing PR #$existing_pr"

            gh pr edit "$existing_pr" \
              --title "$pr_title" \
              --body-file /tmp/pr_body.md
          else
            echo "creating new PR"

            gh pr create \
              --title "$pr_title" \
              --body-file /tmp/pr_body.md \
              --base main \
              --head "$BRANCH_NAME" \
              --label "$LABEL_NAME"
          fi
